# 파이프라인 설정. 코드에 URL·상수를 박지 않고 전부 여기에 둔다.

channel:
  topic: "경제·부동산·금융"
  language: ko

# 2026-08-06 기준으로 실제 응답을 확인한 피드만 남겼다.
# name 은 매체명이다. 같은 매체의 여러 섹션은 같은 name 을 쓴다.
# collect.py 의 cluster_size 는 피드 수가 아니라 **서로 다른 매체 수**를 센다.
# (매일경제 경제/부동산/증권에 같은 기사가 걸려도 화제성이 부풀지 않게)
#
# 제외한 후보와 이유:
#   조선비즈  — summary 가 절반 비어 있고 대신 본문 전문을 내려준다.
#               본문을 대본 입력으로 쓰면 CLAUDE.md 2장(저작권)에 어긋난다.
#   한겨레    — 엔트리에 날짜 필드가 아예 없어 lookback_hours 를 적용할 수 없다.
#   한국경제  — 403 (봇 차단)
#   경향·SBS  — "경제" 섹션 URL 인데 실제로는 사회면 기사가 내려온다.
feeds:
  - name: 연합뉴스
    url: https://www.yna.co.kr/rss/economy.xml
  - name: 매일경제
    url: https://www.mk.co.kr/rss/30100041/     # 경제
  - name: 매일경제
    url: https://www.mk.co.kr/rss/50300009/     # 부동산
  - name: 매일경제
    url: https://www.mk.co.kr/rss/50200011/     # 증권
  - name: 뉴시스
    url: https://www.newsis.com/RSS/economy.xml # newsis.com 은 301 이라 www 로 직접 지정
  - name: 머니투데이
    url: https://rss.mt.co.kr/mt_news.xml       # 섹션 피드가 302 라 전체 피드를 쓴다

collect:
  ranking: cluster        # cluster | recent | keyword
  lookback_hours: 24
  min_title_length: 10
  keywords: []            # ranking 이 keyword 일 때만 사용

  # 피드 요청 설정
  user_agent: "shorts-bot/0.1 (+https://github.com/)"
  request_retries: 3      # 피드 하나당 최대 시도 횟수
  request_backoff: 2.0    # 지수 백오프 기준 초

script_gen:
  # gemini   — 무료 티어 (Flash 계열 기준 10 RPM / 250 RPD). 하루 5건이면 50배 여유.
  #            무료 티어의 입출력은 구글 제품 개선에 사용된다. 공개 기사 요약이라 문제는 없다.
  # anthropic— 유료. 한 달 1,000~3,000원. 무료 티어 변동·품질 이슈가 없다.
  # 대본 품질이 아쉬우면 이 한 줄과 시크릿만 바꾸면 된다.
  provider: gemini          # gemini | anthropic

  # 2026-08-19: gemini-2.5-flash 는 신규 키에 404 를 준다.
  #   "no longer available to new users. Please update to models/gemini-3.6-flash"
  # API 가 직접 지목한 후속 모델로 교체했다. 3.7-flash 도 응답하지만
  # 검증된 쪽을 고정한다 (gemini-flash-latest 같은 별칭은 어느 날 조용히 바뀐다).
  gemini_model: gemini-3.6-flash
  anthropic_model: claude-sonnet-5   # 비용을 더 줄이려면 claude-haiku-4-5

  retries: 3                # 기사 1건당 최대 시도 횟수
  backoff: 2.0              # 지수 백오프 기준 초

  # 숏츠 분량.
  # ko-KR-SunHiNeural + rate "+10%" 실측 발화 속도는 **7.46자/초** 다 (2026-08-06 측정).
  # TASKS.md 초안의 "45초 내외 = 200~250자"는 실제로 27~34초밖에 안 나온다.
  # Task 4 수용 기준(각 30~60초)을 맞추려면 223~447자가 필요하므로 아래로 잡는다.
  #   240자 → 32초 (하한 여유)
  #   330자 → 44초 (목표 "45초 내외")
  #   400자 → 54초 (상한 여유, Task 3 수용 기준의 400자 상한과도 일치)
  # tts.voice 나 tts.rate 를 바꾸면 이 숫자도 다시 재야 한다.
  target_chars: "300~330"
  script_min_chars: 240
  script_max_chars: 400
  title_max_chars: 60       # upload.py가 " #Shorts"를 붙이므로 여유를 둔다

  # 원문 요약과 이 비율 이상 겹치면 베껴 쓴 것으로 보고 다시 생성한다.
  # 저작권 요건이라 느슨하게 두지 않는다.
  max_similarity: 0.80

tts:
  # 2026-08-06 기준 edge-tts 한국어 음성은 3종뿐이다.
  #   ko-KR-SunHiNeural              여성
  #   ko-KR-InJoonNeural             남성
  #   ko-KR-HyunsuMultilingualNeural 남성
  voice: ko-KR-SunHiNeural
  rate: "+10%"            # 숏츠 호흡에 맞춰 살짝 빠르게
  max_seconds: 60         # 넘으면 경고 (숏츠 상한)
  retries: 3              # 음성 1건당 최대 시도 횟수
  backoff: 2.0            # 지수 백오프 기준 초

render:
  width: 1080
  height: 1920
  fps: 30
  background: gradient    # gradient | solid | image
  gradient_from: "#0B1B33" # 어두운 남색 → 경제 채널 톤
  gradient_to: "#123A5E"
  solid_color: "#0B1B33"  # background 가 solid 일 때
  font_path: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
  font_size: 64
  # 숏츠 UI 가 하단 20% 정도를 가린다. 자막은 이 범위 안에만 그린다.
  safe_top_ratio: 0.18
  safe_bottom_ratio: 0.22
